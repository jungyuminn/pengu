<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Pengu</title>
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../press.css" />
    <link rel="stylesheet" href="./settings.css" />
    <link rel="stylesheet" href="../grade-mark.css" />
    <link rel="stylesheet" href="./board.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="brand">
        <img src="../../../assets/icons/pengu_icon.png" alt="" />
        Pengu
      </span>
      <div class="chrome">
        <button type="button" id="prefsBtn" class="chrome-btn" aria-label="설정" title="설정" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.38-1.04-.68-1.62-.92l-.36-2.54a.5.5 0 0 0-.5-.41h-3.84a.5.5 0 0 0-.5.41l-.36 2.54c-.58.24-1.12.54-1.62.92l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94 0 .31.02.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.04.68 1.62.92l.36 2.54c.05.24.24.41.5.41h3.84c.24 0 .45-.17.5-.41l.36-2.54c.58-.24 1.12-.54 1.62-.92l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z" />
          </svg>
        </button>
        <button type="button" id="minimize" class="chrome-btn" aria-label="최소화" title="최소화">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
        </button>
        <button type="button" id="closeWindow" class="chrome-btn close" aria-label="닫기" title="닫기">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
        </button>
      </div>
    </header>

    <div id="prefsMenu" class="prefs" hidden>
      <label class="prefs-row">
        다크 모드
        <input id="darkMode" class="switch" type="checkbox" checked />
      </label>
    </div>

    <div class="toolbar">
      <button id="sync" type="button">새로고침</button>
      <label class="check">
        <input id="overlayEnabled" type="checkbox" checked />
        오버레이
      </label>
      <button id="preview" type="button">테스트</button>
      <span class="meta">
        <span id="patch">-</span>
        ·
        <span id="league">-</span>
        ·
        <span id="keyState">-</span>
      </span>
      <span id="message" class="message"></span>
    </div>

    <div class="board">
      <aside class="tier-pane">
        <input id="championSearch" type="search" placeholder="챔피언 검색" />
        <div class="list-wrap">
          <div class="list-head">
            <span class="rank">#</span>
            <span class="champ-col">챔피언</span>
            <span class="tier-col">티어</span>
          </div>
          <div id="tierList"></div>
        </div>
      </aside>
      <section class="detail-pane" id="championDetail"></section>
    </div>

    <script src="../grade-mark.js"></script>
    <script src="../press.js"></script>
    <script src="./settings.js"></script>
    <script src="./icon-cache.js"></script>
    <script src="./augment-tooltip.js"></script>
    <script src="./champion-board.js"></script>
  </body>
</html>
