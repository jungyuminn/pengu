<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:;"
    />
    <title>Pengu</title>
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../press.css" />
    <link rel="stylesheet" href="./settings.css" />
    <link rel="stylesheet" href="../grade-mark.css" />
    <link rel="stylesheet" href="./board.css" />
    <link rel="stylesheet" href="./home.css" />
    <link rel="stylesheet" href="./match-detail.css" />
    <link rel="stylesheet" href="../mvp.css" />
    <script>
      try {
        if (localStorage.getItem("pengu-me-open") === "0") {
          document.documentElement.classList.add("me-closed");
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <header class="titlebar">
      <button type="button" id="homeBtn" class="brand" aria-label="홈">
        <img src="../../../assets/icons/pengu_icon.png" alt="" />
        Pengu
      </button>
      <div class="chrome">
        <button type="button" id="prefsBtn" class="chrome-btn" aria-label="설정" title="설정" aria-haspopup="true" aria-expanded="false">
          <span class="gear" aria-hidden="true"></span>
        </button>
        <button type="button" id="minimize" class="chrome-btn" aria-label="최소화" title="최소화">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
        </button>
        <button type="button" id="closeWindow" class="chrome-btn close" aria-label="트레이로 숨기기" title="트레이로 숨기기">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
        </button>
      </div>
    </header>

    <div id="prefsMenu" class="prefs" hidden>
      <label class="prefs-row">
        증강 오버레이
        <input id="overlayEnabled" class="switch" type="checkbox" checked />
      </label>
      <p class="prefs-hint">게임 안에서 코어 아이템. 증강 카드가 뜨면 등급을 자동으로 띄웁니다. 전체화면은 테두리 없는 창으로 맞춥니다.</p>
      <label class="prefs-row">
        다크 모드
        <input id="darkMode" class="switch" type="checkbox" checked />
      </label>
    </div>

    <div class="toolbar">
      <button id="sync" type="button" hidden>새로고침</button>
      <button id="preview" type="button" hidden>테스트</button>
      <span class="meta" hidden>
        <span id="league">-</span>
      </span>
      <span id="syncStatus" class="status">
        <span class="spin" aria-hidden="true"></span>
        <span id="message" class="message"></span>
      </span>
    </div>

    <div class="board-wrap">
      <div class="board">
        <aside class="tier-pane">
          <input id="championSearch" type="search" placeholder="챔피언 검색" />
          <div class="list-wrap">
            <div class="list-head">
              <span class="rank">#</span>
              <span class="champ-col">챔피언</span>
              <span class="tier-col">티어</span>
            </div>
            <div id="tierList"></div>
          </div>
        </aside>
        <section class="detail-pane" id="championDetail"></section>
        <aside class="me-pane" id="mePane">
          <div class="me-pane-body" id="mePaneBody"></div>
        </aside>
      </div>
      <button type="button" id="meToggle" class="me-toggle" aria-expanded="true" aria-controls="mePaneBody" title="내 정보 접기" aria-label="내 정보 접기">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" /></svg>
      </button>
    </div>

    <script src="../grade-mark.js"></script>
    <script src="../press.js"></script>
    <script src="./settings.js"></script>
    <script src="./icon-cache.js"></script>
    <script src="./augment-tooltip.js"></script>
    <script src="./home.js"></script>
    <script src="./match-detail.js"></script>
    <script src="./champion-board.js"></script>
  </body>
</html>
